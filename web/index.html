<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Readout 解盲時間預測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F2; --card:#FFFFFF; --ink:#102A36; --ink-2:#4A606C; --ink-3:#7E919A;
  --line:#D3DCDE; --curve:#1F55E8; --curve-soft:rgba(31,85,232,.12); --window:rgba(31,85,232,.07);
  --up:#0B7A55; --down:#C0392B; --warn:#A8670E; --warn-bg:#FBF0DC; --chip:#E3EAEC;
  --tab-h:62px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C171D; --card:#132229; --ink:#E4ECEF; --ink-2:#A6B7BF; --ink-3:#6F848E;
    --line:#24363F; --curve:#6F95FF; --curve-soft:rgba(111,149,255,.18); --window:rgba(111,149,255,.09);
    --up:#3CC48F; --down:#F07A6B; --warn:#E3A84A; --warn-bg:#2A2214; --chip:#1C2E36;
  }
}
:root[data-theme="dark"]{
  --paper:#0C171D; --card:#132229; --ink:#E4ECEF; --ink-2:#A6B7BF; --ink-3:#6F848E;
  --line:#24363F; --curve:#6F95FF; --curve-soft:rgba(111,149,255,.18); --window:rgba(111,149,255,.09);
  --up:#3CC48F; --down:#F07A6B; --warn:#E3A84A; --warn-bg:#2A2214; --chip:#1C2E36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);min-height:100%;
  font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--curve);outline-offset:2px;border-radius:6px}
a{color:var(--curve)}
.shell{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tab-h) + 24px)}

/* header */
.top{padding:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em}
.brand small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:13px;color:var(--ink-2);letter-spacing:0}
.snap{font-size:12px;color:var(--ink-3);text-align:right}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:10px 12px;border-radius:10px;margin:4px 0 16px;line-height:1.5}
h2{font-size:17px;font-weight:700;margin:24px 0 10px}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink-3)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;background:var(--chip);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* event list */
.ev{display:grid;grid-template-columns:1fr auto;gap:4px 14px;width:100%;text-align:left;background:var(--card);
  border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line)}
.ev .tk{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13px;color:var(--ink-2)}
.ev .type{font-size:12px;color:var(--ink-3);margin-left:6px}
.ev .t{font-weight:600;font-size:15px;line-height:1.4}
.ev .g{font-size:13px;color:var(--ink-2);grid-column:1/2}
.ev .p{grid-row:1/4;grid-column:2;text-align:right;align-self:center}
.ev .p b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:30px;line-height:1;font-weight:600;color:var(--curve)}
.ev .p span{font-size:11px;color:var(--ink-3)}
.bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--chip);position:relative;overflow:hidden;margin-top:6px}
.bar i{position:absolute;top:0;bottom:0;background:var(--curve-soft)}
.bar em{position:absolute;top:-2px;width:2px;height:10px;background:var(--ink)}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-2)}
.list{list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:78px 1fr;gap:10px}
.list li:first-child{border-top:0}
.list .d{color:var(--ink-3);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--chip);color:var(--ink-2);margin-right:4px;vertical-align:1px}
.tag.derived{background:var(--warn-bg);color:var(--warn)}
.up{color:var(--up)} .down{color:var(--down)}
.flag{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-2);font-weight:500}
svg text{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* detail overlay */
.detail{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
  transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
.detail.open{transform:none;visibility:visible}
@media (prefers-reduced-motion: reduce){.detail{transition:none}}
.back{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--curve);padding:8px 0}
.hero-p{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.hero-p b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:56px;font-weight:600;line-height:1;color:var(--curve)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-3)}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs svg{width:22px;height:22px}
.view[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Readout<small>解盲時間預測</small></div>
    <div class="snap">資料快照<br><span class="num" id="snap-date">—</span></div>
  </header>
  <div class="demo">原型版本：機率來自以公司預告時間窗為中心的示範分布，模型尚未用歷史資料訓練。事實資料為手動整理的快照。</div>

  <section class="view" id="v-upcoming"></section>
  <section class="view" id="v-company" hidden></section>
  <section class="view" id="v-ledger" hidden></section>
  <section class="view" id="v-about" hidden></section>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="shell" id="detail-body"></div>
</div>

<nav class="tabs" aria-label="主選單"><div class="in" role="tablist">
  <button role="tab" data-tab="upcoming" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M4 17c4 0 6-10 10-10s4 4 6 4"/></svg>近期</button>
  <button role="tab" data-tab="company"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>公司</button>
  <button role="tab" data-tab="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l4 4 10-10"/><path d="M4 20h16"/></svg>帳本</button>
  <button role="tab" data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>說明</button>
</div></nav>

<script>
/* =====================================================================
   DATA — loaded from data/snapshot.json (schema v0), produced by the backend.
   window: guidance window [start,end]; pWithin: share of probability mass
   inside the window; the rest spills after `end` (exponential, mean 75 d).
   derived:true marks numbers we computed rather than read from a source.
   ===================================================================== */
const SNAPSHOT_URL = '../data/snapshot.json';
let DATA = null, TODAY = null, T0 = null; // TODAY = snapshot_date, set on load

/* ============================ MODEL (demo) ============================ */
const DAY = 864e5;
const d = s => new Date(s + 'T00:00:00Z').getTime();
const SPILL = 75, KA = 2.0, KB = 1.6; // Kumaraswamy shape: mass leans toward later part of window
function cdf(ev, t){
  const a = d(ev.window[0]), b = d(ev.window[1]), pw = ev.pWithin;
  if (t < a) return 0;
  if (t <= b){ const x = (t - a) / Math.max(b - a, DAY); return pw * (1 - Math.pow(1 - Math.pow(x, KA), KB)); }
  return pw + (1 - pw) * (1 - Math.exp(-(t - b) / DAY / SPILL));
}
function ccdf(ev, t){ // conditional on not announced by today
  const f0 = cdf(ev, T0); if (t <= T0) return 0;
  return Math.max(0, (cdf(ev, t) - f0) / (1 - f0));
}
function quant(ev, p){
  let lo = T0, hi = d(ev.window[1]) + 900 * DAY;
  for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; ccdf(ev, m) < p ? lo = m : hi = m; }
  return hi;
}
const pct = x => Math.round(x * 100) + '%';
const fmt = t => { const x = new Date(t); return x.getUTCFullYear() + '/' + (x.getUTCMonth()+1) + '/' + x.getUTCDate(); };
const fmtM = t => { const x = new Date(t); return x.getUTCFullYear() + '/' + (x.getUTCMonth()+1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


/* ============================ PRICE CHART ============================ */
function priceSVG(c){
  const P = c.prices.map(([s, v]) => [d(s), v]);
  const W = 360, H = 200, L = 36, R = 12, Tp = 14, B = 56;
  const t0 = P[0][0], t1 = P[P.length-1][0];
  const lo = 80, hi = 190;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
  let solid = '', dash = '';
  for (let i = 1; i < P.length; i++){
    const seg = `M${x(P[i-1][0]).toFixed(1)},${y(P[i-1][1]).toFixed(1)}L${x(P[i][0]).toFixed(1)},${y(P[i][1]).toFixed(1)}`;
    (P[i][0] - P[i-1][0] > 5*DAY) ? dash += seg : solid += seg;
  }
  const grid = [100,140,180].map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" font-size="10" text-anchor="end" fill="var(--ink-3)">$${v}</text>`).join('');
  const months = ['2026-08-01','2026-09-01'].map(m => `<text x="${x(d(m))}" y="${H-B+14}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${+m.slice(5,7)}月</text>`).join('');
  let prevX = -99, row = 0;
  const marks = c.priceMarks.map((m, i) => { const mx = x(d(m.d)); row = (mx - prevX < 20) ? 1 - row : 0; prevX = mx; const cy = H - B + 24 + row * 20;
    return `<line x1="${mx}" x2="${mx}" y1="${Tp}" y2="${cy - 8}" stroke="var(--warn)" stroke-dasharray="2 3"/>
    <circle cx="${mx}" cy="${cy}" r="8" fill="var(--warn-bg)" stroke="var(--warn)"/><text x="${mx}" y="${cy + 3.5}" font-size="10" text-anchor="middle" fill="var(--warn)">${'ABCD'[i]}</text>`; }).join('');
  const gapMid = x((d('2026-08-10') + d('2026-09-23')) / 2);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="TWST 股價走勢">
    ${grid}${months}${marks}
    <path d="${dash}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${gapMid}" y="${y(128)}" font-size="10" text-anchor="middle" fill="var(--ink-3)">資料缺口</text>
    <path d="${solid}" fill="none" stroke="var(--curve)" stroke-width="2.2" stroke-linejoin="round"/>
    ${P.map(([t, v]) => `<circle cx="${x(t)}" cy="${y(v)}" r="1.8" fill="var(--curve)"/>`).join('')}
    <circle cx="${x(P[P.length-1][0])}" cy="${y(P[P.length-1][1])}" r="4" fill="var(--card)" stroke="var(--curve)" stroke-width="2"/>
  </svg>`;
}
function priceBlock(){
  if (filter === 'LLY' || filter === 'VKTX') return `<div class="card small muted">${filter} 的股價走勢要等後端串接股價 API 後才會顯示。</div>`;
  const c = DATA.companies.TWST, first = c.prices[0][1], ret = Math.round((c.price.value / first - 1) * 100);
  return `<div class="card" style="padding:14px 10px 10px">
    <div style="padding:0 4px"><div class="tiny">TWST　${c.name}</div>
      <div class="hero-p" style="margin:2px 0 0"><b class="num" style="font-size:40px">$${c.price.value.toFixed(2)}</b><span class="up num small">7/10 以來 +${ret}%</span></div>
      <p class="tiny">${c.price.date.replace(/-/g,'/')} ${c.price.note}</p></div>
    ${priceSVG(c)}
    <ul class="list" style="padding:0 4px">${c.priceMarks.map((m, i) => `<li style="grid-template-columns:22px 52px 1fr;padding:6px 0"><span class="num" style="color:var(--warn);font-weight:700">${'ABCD'[i]}</span><span class="d num">${m.d.slice(5).replace('-','/')}</span><span>${m.t}</span></li>`).join('')}</ul>
    <p class="tiny" style="padding:4px 4px 0">${c.priceContext}。下一個事件：Q4 財報，推估 11 月中。</p></div>`;
}

/* ============================ UPCOMING ============================ */
let filter = 'ALL';
function renderUpcoming(){
  const evs = DATA.events.filter(e => filter === 'ALL' || e.tk === filter)
    .map(e => { const p90 = ccdf(e, T0 + 90*DAY); const far = p90 < .05; return {e, p: far ? ccdf(e, T0 + 365*DAY) : p90, h: far ? '1 年內' : '90 天內', med: quant(e, .5)}; })
    .sort((x, y) => x.med - y.med);
  const span = [T0, T0 + 540*DAY];
  const pos = t => Math.min(100, Math.max(0, (t - span[0]) / (span[1] - span[0]) * 100));
  const chips = ['ALL','TWST','LLY','VKTX'].map(k =>
    `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${k==='ALL'?'全部':k}</button>`).join('');
  document.getElementById('v-upcoming').innerHTML = `
    <div class="chips">${chips}</div>
    ${priceBlock()}
    <h2>即將發生的事件</h2>
    <p class="tiny" style="margin-bottom:10px">依預測中位數日期排序。數字為「未來 90 天內發生」的機率（較遠的事件改顯示 1 年內）；橫條為今天起 18 個月，淺藍是預告時間窗，黑線是預測中位數。</p>
    ${evs.map(({e,p,h,med}) => `
      <button class="ev" data-ev="${e.id}">
        <div><span class="tk">${e.tk}</span><span class="type">${e.type}</span></div>
        <div class="t">${esc(e.title)}</div>
        <div class="g">最可能 ${fmtM(med)}${e.derived ? ' <span class="tag derived">含推算</span>' : ''}</div>
        <div class="p"><b>${pct(p)}</b><span>${h}</span></div>
        <div class="bar"><i style="left:${pos(d(e.window[0]))}%;width:${pos(d(e.window[1]))-pos(d(e.window[0]))}%"></i><em style="left:${pos(med)}%"></em></div>
      </button>`).join('')}`;
}

/* ============================ DETAIL ============================ */
function curveSVG(e){
  const W = 360, H = 200, L = 34, R = 10, Tp = 12, B = 30;
  const endT = Math.max(d(e.window[1]) + 150*DAY, T0 + 200*DAY);
  const x = t => L + (t - T0) / (endT - T0) * (W - L - R);
  const y = p => Tp + (1 - p) * (H - Tp - B);
  let path = '';
  for (let i = 0; i <= 120; i++){ const t = T0 + (endT - T0) * i / 120; path += (i ? 'L' : 'M') + x(t).toFixed(1) + ',' + y(ccdf(e, t)).toFixed(1); }
  const q10 = quant(e,.1), q50 = quant(e,.5), q90 = quant(e,.9);
  const wa = Math.max(d(e.window[0]), T0), wb = d(e.window[1]);
  let ticks = '';
  const s = new Date(T0); let m = new Date(Date.UTC(s.getUTCFullYear(), s.getUTCMonth() + 1, 1)).getTime();
  const stepM = (endT - T0) / DAY > 400 ? 3 : 2; let k = 0;
  while (m < endT){ if (k % stepM === 0){ const dm = new Date(m);
      ticks += `<line x1="${x(m)}" x2="${x(m)}" y1="${y(0)}" y2="${y(0)+4}" stroke="var(--ink-3)"/><text x="${x(m)}" y="${H-10}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${String(dm.getUTCFullYear()).slice(2)}/${dm.getUTCMonth()+1}</text>`; }
    k++; m = new Date(Date.UTC(new Date(m).getUTCFullYear(), new Date(m).getUTCMonth() + 1, 1)).getTime(); }
  const grid = [0,.5,1].map(p => `<line x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)"/><text x="${L-6}" y="${y(p)+3}" font-size="10" text-anchor="end" fill="var(--ink-3)">${p*100}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="公布累積機率曲線">
    <rect x="${x(wa)}" y="${Tp}" width="${Math.max(0,x(wb)-x(wa))}" height="${H-Tp-B}" fill="var(--window)"/>
    ${grid}${ticks}
    <line x1="${x(q10)}" x2="${x(q90)}" y1="${y(0)-8}" y2="${y(0)-8}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${x(q10)}" x2="${x(q10)}" y1="${y(0)-12}" y2="${y(0)-4}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${x(q90)}" x2="${x(q90)}" y1="${y(0)-12}" y2="${y(0)-4}" stroke="var(--ink)" stroke-width="2"/>
    <path d="${path}" fill="none" stroke="var(--curve)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(q50)}" cy="${y(.5)}" r="4.5" fill="var(--card)" stroke="var(--curve)" stroke-width="2.5"/>
    <line x1="${L}" x2="${L}" y1="${Tp}" y2="${y(0)}" stroke="var(--ink)" stroke-dasharray="3 3"/>
    <text x="${L+4}" y="${Tp+10}" font-size="10" fill="var(--ink)">今天</text>
  </svg>`;
}
function openDetail(id){
  const e = DATA.events.find(v => v.id === id); if (!e) return;
  const c = DATA.companies[e.tk];
  const p90 = ccdf(e, T0+90*DAY), p180 = ccdf(e, T0+180*DAY), p365 = ccdf(e, T0+365*DAY);
  const related = (c.events || []).slice(0, 3);
  document.getElementById('detail-body').innerHTML = `
    <button class="back" data-close>‹ 返回</button>
    <div class="tiny">${e.tk}　${esc(c.name)}　${e.type}${e.phase ? '　' + e.phase : ''}</div>
    <h2 id="d-title" style="margin-top:4px">${esc(e.title)}</h2>
    <div class="hero-p"><b>${fmtM(quant(e,.5))}</b><span class="muted small">最可能的月份（中位數）</span></div>
    <p class="small muted">80% 區間：${fmt(quant(e,.1))} 至 ${fmt(quant(e,.9))}</p>
    <div class="card" style="margin-top:12px;padding:10px 8px 4px">${curveSVG(e)}
      <p class="tiny" style="padding:0 6px 8px">藍線：到該日期為止「已公布」的累積機率（假設今天尚未公布）。淺藍區塊：預告時間窗。黑色括號：80% 區間。</p></div>
    <div class="stats">
      <div class="stat"><b>${pct(p90)}</b><span>90 天內</span></div>
      <div class="stat"><b>${pct(p180)}</b><span>180 天內</span></div>
      <div class="stat"><b>${pct(p365)}</b><span>1 年內</span></div>
    </div>
    <h2>預測依據</h2>
    <div class="card"><dl class="kv">
      <dt>公司預告</dt><dd>${esc(e.guidance)}</dd>
      <dt>時間窗</dt><dd class="num">${e.window[0]} 至 ${e.window[1]}</dd>
      <dt>窗內機率</dt><dd class="num">${pct(e.pWithin)}</dd>
    </dl></div>
    <ul class="card list" style="padding-top:4px;padding-bottom:4px">${e.basis.map(b => `<li style="grid-template-columns:1fr">${esc(b)}</li>`).join('')}</ul>
    <div class="flag">示範分布：時間窗內的機率偏向後段（公司常在預告期限前才公布），窗外部分以平均 75 天延後。正式版會用歷史「預告 vs. 實際公布」資料估計這些參數。</div>
    ${related.length ? `<h2>${e.tk} 近期事件</h2><ul class="card list">${related.map(r => `<li><span class="d num">${r.d.slice(5).replace('-','/')}</span><span>${esc(r.t)} <span class="tag">${r.src}</span></span></li>`).join('')}</ul>` : ''}
  `;
  const el = document.getElementById('detail'); el.classList.add('open'); el.scrollTop = 0;
  if (location.hash !== '#ev-' + id) history.pushState(null, '', '#ev-' + id);
}
function closeDetail(){ document.getElementById('detail').classList.remove('open'); }

/* ============================ COMPANY ============================ */
let co = 'TWST';
function barsSVG(items, opts){
  const W = 340, H = 150, B = 26, Tp = 16, max = opts.max, bw = (W - 20) / items.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opts.label}">
    ${items.map((it, i) => { const h = (it.v / max) * (H - B - Tp), x = 10 + i * bw + bw * .18, w = bw * .64, y = H - B - h;
      const fill = it.guide ? 'none' : (it.derived ? 'var(--curve-soft)' : 'var(--curve)');
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${fill}" stroke="var(--curve)" ${it.guide ? 'stroke-dasharray="4 3"' : ''}/>
        <text x="${x + w/2}" y="${y - 5}" font-size="11" text-anchor="middle" fill="var(--ink)">${it.v}</text>
        <text x="${x + w/2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--ink-2)">${it.q}</text>`; }).join('')}
  </svg>`;
}
function renderCompany(){
  const seg = ['TWST','LLY','VKTX'].map(k => `<button data-co="${k}" aria-pressed="${co===k}">${k}</button>`).join('');
  const c = DATA.companies[co]; let body = '';
  if (co === 'TWST'){
    const gap = Math.round((c.analyst.mean / c.price.value - 1) * 100);
    body = `
      <div class="card"><div class="tiny">${c.name}　${c.kind}　沒有自有臨床試驗</div>
        <div class="hero-p"><b class="num">$${c.price.value.toFixed(2)}</b><span class="num muted">${c.price.change}</span></div>
        <p class="small muted">${c.price.date.replace(/-/g,'/')} ${c.price.note}</p></div>
      <div class="flag">股價與分析師平均目標價 $${c.analyst.mean} 相差 <b class="num">${gap}%</b>，最高目標價 $${c.analyst.high} 也低於股價。（${c.analyst.source}）</div>
      <h2>${c.revenue.label}（${c.revenue.unit}）</h2>
      <div class="card">${barsSVG(c.revenue.items,{max:140,label:'各季營收'})}
        <p class="tiny"><span class="tag derived">Q2 推算</span>由全年指引中值減其他季度推得。虛線 Q4 為公司指引中值。</p></div>
      <h2>獲利與現金</h2>
      <div class="card"><dl class="kv">
        <dt>毛利率</dt><dd class="num">${c.margin.map(m => m.q + ' ' + m.v + '%').join('　')}</dd></dl>
        <p class="small" style="margin-top:10px">${c.loss.text}</p>
        <p class="small" style="margin-top:8px">${c.cash.text}</p>
        <p class="tiny" style="margin-top:8px"><span class="tag derived">推算</span>以 1 月市值約 25.4 億美元、股價 $42 估算，本次增資稀釋約 5%。</p></div>
      <h2>近期事件</h2>
      <ul class="card list">${c.events.map(r => `<li><span class="d num">${r.d.slice(5).replace('-','/')}</span><span>${esc(r.t)} <span class="tag">${r.src}</span></span></li>`).join('')}</ul>`;
  } else if (co === 'LLY'){
    body = `
      <div class="card"><div class="tiny">${c.name}　${c.kind}</div><p class="small" style="margin-top:6px">${c.note}</p>
        <p class="tiny" style="margin-top:8px">股價：原型未載入，後端上線後即時更新。</p></div>
      <h2>${c.program.drug}</h2>
      <ul class="card list">${c.program.items.map(i => `<li><span class="d num">${i.d.length === 10 ? i.d.slice(2).replace(/-/g,'/') : i.d}</span><span>${i.done ? '<span class="up">已公布</span>　' : '<span class="muted">待發生</span>　'}${esc(i.t)}</span></li>`).join('')}</ul>
      <h2>與另外兩家的關係</h2>
      <ul class="card list">${c.links.map(l => `<li style="grid-template-columns:1fr">${esc(l)}</li>`).join('')}</ul>`;
  } else {
    const last = c.cash[c.cash.length - 1].v, qs = last / c.burnPerQ;
    const runEnd = d('2026-06-30') + qs * 91.3 * DAY;
    const v1 = quant(DATA.events.find(e => e.id === 'vktx-v1'), .5), v2 = quant(DATA.events.find(e => e.id === 'vktx-v2'), .5);
    body = `
      <div class="card"><div class="tiny">${c.name}　${c.kind}</div>
        <p class="small" style="margin-top:6px">公司價值幾乎都押在 VK2735（GLP-1/GIP 雙重促效劑）。9/22 維持劑量試驗公布當天股價上漲約 27%。</p>
        <p class="tiny" style="margin-top:8px">股價：原型未載入，後端上線後即時更新。</p></div>
      <h2>臨床管線</h2>
      <ul class="card list">${c.pipeline.map(p => `<li><span class="num" style="font-weight:700;font-size:16px">${p.ph}</span><span><b>${p.trial}</b><br><span class="small muted">${p.drug}${p.n !== '—' ? '，' + p.n + ' 人' : ''}</span><br><span class="small">${p.status}</span></span></li>`).join('')}</ul>
      <h2>現金（百萬美元）</h2>
      <div class="card">${barsSVG(c.cash,{max:1000,label:'現金變化'})}</div>
      <h2>現金跑道 vs. 解盲時間</h2>
      <div class="card"><dl class="kv">
        <dt>最近一季燒錢</dt><dd class="num">約 ${c.burnPerQ} 百萬美元</dd>
        <dt>現金可撐</dt><dd class="num">約 ${qs.toFixed(1)} 季，至 ${fmtM(runEnd)}</dd>
        <dt>VANQUISH-1 預測</dt><dd class="num">${fmtM(v1)}</dd>
        <dt>VANQUISH-2 預測</dt><dd class="num">${fmtM(v2)}</dd></dl>
        <div class="flag">${runEnd < v1 ? '依線性推算，現金可能在兩項 VANQUISH 讀出前就用完，解盲前增資的可能性值得關注。' : runEnd < v2 ? '依線性推算，現金可能在 VANQUISH-2 讀出前用完，解盲前增資的可能性值得關注。' : '依線性推算，現金足以撐到兩項解盲。'}</div>
        <p class="tiny"><span class="tag derived">推算</span>以最近一季燒錢速度線性外推，未計入利息收入、支出變化或新的融資。</p></div>`;
  }
  document.getElementById('v-company').innerHTML = `<div class="seg" role="group" aria-label="選擇公司">${seg}</div>${body}`;
}

/* ============================ LEDGER ============================ */
function renderLedger(){
  const inWin = DATA.ledger.filter(l => d(l.actual) >= d(l.window[0]) && d(l.actual) <= d(l.window[1])).length;
  document.getElementById('v-ledger').innerHTML = `
    <h2 style="margin-top:8px">預告 vs. 實際公布</h2>
    <p class="small muted">每一筆預測都會記在這裡，事件發生後自動比對。目前是回填的歷史紀錄，用來看公司預告的準度和習慣。</p>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><b class="num">${inWin}/${DATA.ledger.length}</b><span>落在預告時間窗內</span></div>
      <div class="stat"><b class="num">${DATA.ledger.length}</b><span>筆紀錄（校準需 30 筆以上）</span></div>
    </div>
    ${DATA.ledger.map(l => { const a = d(l.window[0]), b = d(l.window[1]), t = d(l.actual), p = (t - a) / (b - a);
      return `<div class="card">
        <div class="tiny">${l.tk}　預告 ${l.guidance}</div>
        <h3 style="margin-top:2px">${esc(l.title)}</h3>
        <div style="position:relative;height:22px;margin:10px 0 4px">
          <div style="position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--curve-soft)"></div>
          <div style="position:absolute;left:calc(${(p*100).toFixed(1)}% - 7px);top:4px;width:14px;height:14px;border-radius:50%;background:var(--curve);border:2px solid var(--card)"></div>
        </div>
        <div style="display:flex;justify-content:space-between" class="tiny num"><span>${l.window[0].slice(2).replace(/-/g,'/')}</span><span>${l.window[1].slice(2).replace(/-/g,'/')}</span></div>
        <dl class="kv" style="margin-top:8px">
          <dt>實際公布</dt><dd class="num">${l.actual.replace(/-/g,'/')}（窗內第 ${Math.round(p*100)}% 位置）</dd>
          <dt>股價反應</dt><dd>${l.reaction ? `<span class="up num">${l.reaction}</span> <span class="tiny">${l.rnote}</span>` : '<span class="tiny">原型未載入</span>'}</dd>
        </dl></div>`; }).join('')}
    <div class="flag">觀察：Viking 在距離預告期限只剩 8 天時才公布，是「接近期限才公布」的典型；Lilly 以「年度」為預告單位，時間窗太寬，模型需要改用 CT.gov 完成日等其他變數補足。</div>`;
}

/* ============================ ABOUT ============================ */
function renderAbout(){
  document.getElementById('v-about').innerHTML = `
    <h2 style="margin-top:8px">這個 app 在預測什麼</h2>
    <p class="small">預測「某個試驗結果或重大事件什麼時候公布」，而不是股價漲跌。解盲時間本質上是存活分析問題：從預告或試驗完成開始，到 topline 公布為止的時間。</p>
    <h2>正式版的模型</h2>
    <ul class="card list">
      <li style="grid-template-columns:1fr"><span><b>結果變數</b>　從 primary completion date 到首次公布 topline（8-K 或新聞稿）的天數；尚未公布的試驗視為設限資料</span></li>
      <li style="grid-template-columns:1fr"><span><b>主要共變數</b>　公司預告時間窗、該公司過去預告的準度、Phase、適應症、公司規模、是否對齊醫學大會</span></li>
      <li style="grid-template-columns:1fr"><span><b>驗證方式</b>　預測帳本累積 Brier score 與校準圖</span></li>
    </ul>
    <h2>資料來源（正式版）</h2>
    <p class="small">ClinicalTrials.gov API v2、SEC EDGAR（8-K 與 XBRL 財報）、股價 API、公司新聞稿。由後端排程每日更新，前端讀取固定格式的 JSON。</p>
    <h2>下一步</h2>
    <p class="small">在 Claude Code 建立 Python 後端：抓取資料、建立歷史「預告 vs. 公布」資料集、訓練模型、每日推播。新增公司只需要在清單加一個股票代號。</p>
    <p class="tiny" style="margin-top:24px">個人研究工具，非投資建議。資料為手動整理的快照，可能有延遲或錯誤。</p>`;
}

/* ============================ WIRING ============================ */
const views = {upcoming:renderUpcoming, company:renderCompany, ledger:renderLedger, about:renderAbout};
function showTab(k){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k));
  Object.keys(views).forEach(v => document.getElementById('v-' + v).hidden = v !== k);
  views[k](); window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-retry')){ boot(); return; }
  if (!DATA) return;
  if (t.dataset.tab) showTab(t.dataset.tab);
  else if (t.dataset.f){ filter = t.dataset.f; renderUpcoming(); }
  else if (t.dataset.ev) openDetail(t.dataset.ev);
  else if (t.dataset.co){ co = t.dataset.co; renderCompany(); }
  else if (t.hasAttribute('data-close')){ if (location.hash.startsWith('#ev-')) history.back(); else closeDetail(); }
});
window.addEventListener('popstate', () => { if (!DATA) return; if (location.hash.startsWith('#ev-')) openDetail(location.hash.slice(4)); else closeDetail(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDetail(); });
function showStatus(html){
  Object.keys(views).forEach(v => document.getElementById('v-' + v).hidden = v !== 'upcoming');
  document.getElementById('v-upcoming').innerHTML = html;
}
async function boot(){
  showStatus(`<div class="card small muted" role="status" style="margin-top:12px">載入資料中…</div>`);
  try {
    const r = await fetch(SNAPSHOT_URL, {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    if (s.schema_version !== '0') throw new Error('不支援的 schema 版本：' + s.schema_version);
    DATA = s; TODAY = s.snapshot_date; T0 = d(TODAY);
    document.getElementById('snap-date').textContent = TODAY;
  } catch (err) {
    showStatus(`<div class="flag" role="alert" style="margin-top:12px">無法載入資料快照（${esc(err.message)}）。請確認網路連線後重試。</div>
      <button class="chip" data-retry style="min-height:44px;padding:0 18px">重試</button>`);
    return;
  }
  showTab('upcoming');
  if (location.hash.startsWith('#ev-')) openDetail(location.hash.slice(4));
}
boot();
</script>
